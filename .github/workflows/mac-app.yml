# Builds the native Mac app and packages it as a DMG on a macOS runner.
# Every pull request and push to main uploads the DMG as a workflow artifact;
# pushing a v* tag also attaches it to that tag's GitHub release. Run it by
# hand (workflow_dispatch) to build any branch, or give it a tag name to cut
# a release (tag + GitHub release + DMG) without needing a Mac.
#
# Signing: with no secrets the app is ad-hoc signed, and macOS shows the
# "could not verify ... is free of malware" dialog on first launch. Add these
# repository secrets and the workflow signs with Developer ID and notarizes
# instead, so the app opens with no warning:
#   APPLE_CERTIFICATE_P12       base64 of a "Developer ID Application" cert + key (.p12)
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_ID                    Apple ID e-mail of the developer account
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password for notarytool
name: Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v1.1.0) and attach the DMG. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-14
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$identity" || { echo "No Developer ID Application identity found in the certificate" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app
        run: ./macos/build.sh

      - name: Notarize app
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "dist/HN Firehose.app" "$RUNNER_TEMP/app.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/HN Firehose.app"

      - name: Package DMG
        run: SKIP_BUILD=1 ./macos/make-dmg.sh

      - name: Notarize DMG
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="$(ls dist/*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/HN Firehose.app"
          hdiutil verify dist/*.dmg
          if [ "$HAS_SIGNING" = "true" ]; then
            spctl --assess --type execute --verbose=2 "dist/HN Firehose.app"
            xcrun stapler validate dist/*.dmg
          fi
          ls -la dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HN-Firehose-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Release metadata
        id: rel
        if: env.RELEASE == 'true'
        run: |
          tag="${{ inputs.release_tag || github.ref_name }}"
          # Name the release after the app's own version ("HN Firehose 1.1"),
          # matching the DMG filename, rather than the tag ("v1.1.0").
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "dist/HN Firehose.app/Contents/Info.plist")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=HN Firehose $version" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "## Install"
            echo
            echo "1. Download the \`.dmg\` below and open it."
            echo "2. Drag **HN Firehose** to **Applications**."
            if [ "$HAS_SIGNING" = "true" ]; then
              echo "3. Open it. The app is signed with a Developer ID and notarized by Apple."
            else
              echo "3. First launch: macOS will say it *could not verify \"HN Firehose\" is free of malware* because this build is not notarized. Click **Done**, then open **System Settings → Privacy & Security**, scroll to *Security*, and click **Open Anyway** next to HN Firehose. (Or run \`xattr -d com.apple.quarantine \"/Applications/HN Firehose.app\"\` in Terminal.) This is needed once."
            fi
            echo
            echo "Requires macOS 12+ (Apple Silicon)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach DMG to release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.rel.outputs.name }}
          body: ${{ steps.rel.outputs.body }}
          generate_release_notes: true
          files: dist/*.dmg
