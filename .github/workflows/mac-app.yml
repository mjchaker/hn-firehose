# Builds the native Mac app and packages it as a DMG on a macOS runner.
# Every push and pull request uploads the DMG as a workflow artifact;
# pushing a v* tag also attaches it to that tag's GitHub release.
name: Mac app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: ./macos/make-dmg.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose "dist/HN Firehose.app"
          hdiutil verify dist/*.dmg
          ls -la dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HN-Firehose-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
