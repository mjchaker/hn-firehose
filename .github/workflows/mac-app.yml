# Builds the native Mac app and packages it as a DMG on a macOS runner.
# Every pull request and push to main uploads the DMG as a workflow artifact;
# pushing a v* tag also attaches it to that tag's GitHub release. Run it by
# hand (workflow_dispatch) to build any branch, or give it a tag name to cut
# a release (tag + GitHub release + DMG) without needing a Mac.
name: Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v1.1.0) and attach the DMG. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: ./macos/make-dmg.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose "dist/HN Firehose.app"
          hdiutil verify dist/*.dmg
          ls -la dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HN-Firehose-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: HN Firehose ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.dmg
