# Builds the native Mac app and packages it as a DMG on a macOS runner.
# Every pull request and push to main uploads the DMG as a workflow artifact;
# pushing a v* tag also attaches it to that tag's GitHub release. Run it by
# hand (workflow_dispatch) for any other branch.
name: Mac app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose hdiutil (temporary)
        continue-on-error: true
        run: |
          sw_vers; uname -m; hdiutil version || true
          echo "TMPDIR=$TMPDIR"; ls -ld "$TMPDIR" /Applications
          d="$(mktemp -d)"; echo hi > "$d/hello.txt"; ln -s /Applications "$d/Applications"; ls -la "$d"
          hdiutil create -verbose -volname T -srcfolder "$d" -fs HFS+ -format UDZO -ov "$RUNNER_TEMP/t1.dmg" 2>&1 | tail -30 || true
          rm -f "$d/Applications"
          hdiutil create -verbose -volname T -srcfolder "$d" -fs HFS+ -format UDZO -ov "$RUNNER_TEMP/t2.dmg" 2>&1 | tail -30 || true
          ls -la "$RUNNER_TEMP"/*.dmg || true

      - name: Build app and DMG
        run: ./macos/make-dmg.sh

      - name: Verify bundle
        run: |
          codesign --verify --verbose "dist/HN Firehose.app"
          hdiutil verify dist/*.dmg
          ls -la dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: HN-Firehose-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
